resources:
  apps:
    radar_app:
      name: traackr-renewal-radar
      description: Brand-facing API and operator console served from Lakebase
      source_code_path: ../app
      user_api_scopes: [dashboards.genie]
      resources:
        - name: lakebase
          postgres:
            branch: ${var.lakebase_branch}
            database: ${var.lakebase_database_resource}
            permission: CAN_CONNECT_AND_CREATE
        - name: genie-space
          genie_space:
            name: Traackr Renewal Radar
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: explain-model
          serving_endpoint:
            name: databricks-claude-haiku-5-5
            permission: CAN_QUERY
        - name: orchestration-job
          job:
            id: ${resources.jobs.radar_daily.id}
            permission: CAN_VIEW
